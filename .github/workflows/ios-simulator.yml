name: iOS simulator build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Compile iPhone device framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64

      - name: Run iOS simulator tests
        run: ./gradlew :ktorExt:iosSimulatorArm64Test :spotify:iosSimulatorArm64Test :data:iosSimulatorArm64Test

      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/SimpMusic.xcodeproj \
            -target SimpMusic \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath "$RUNNER_TEMP/SimpMusicDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: simpmusic-ios-simulator
          path: ${{ runner.temp }}/SimpMusicDerivedData/Build/Products/Debug-iphonesimulator/SimpMusic.app
          if-no-files-found: error
